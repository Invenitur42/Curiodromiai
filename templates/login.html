<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curiodromiai — Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .login-shell {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 34px 28px;
    width: 280px;
    text-align: center;
  }
  .login-card h1 {
    font-size: 16px;
    margin: 0 0 4px;
    color: var(--text);
    font-weight: 600;
  }
  .login-card p.tagline {
    font-size: 12px;
    color: var(--text-faint);
    margin: 0 0 20px;
  }
  .login-card input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font-body);
    margin-bottom: 12px;
  }
  .login-card input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .login-card button {
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 600;
    font-family: var(--font-body);
    cursor: pointer;
  }
  .login-card button:hover {
    background: var(--accent-strong);
  }
  .login-error {
    color: var(--danger);
    font-size: 12px;
    margin: 0 0 12px;
  }
</style>
</head>
<body>
  <div class="login-shell">
    <form class="login-card" method="POST">
      <h1>Curiodromiai</h1>
      <p class="tagline">Enter the password to continue</p>
      {% if error %}<p class="login-error">Incorrect password.</p>{% endif %}
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit">Enter</button>
    </form>
  </div>
</body>
</html>
