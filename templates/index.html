<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athenaeum</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="app">
    <header>
      <button id="menu-btn" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2c-2 4-4 6-4 10a4 4 0 008 0c0-4-2-6-4-10z"/>
          <path d="M12 12v10"/>
        </svg>
      </button>
      <h1>Athenaeum</h1>
      <button id="new-chat-btn" title="New Chat">New Chat</button>
    </header>
    <aside id="sidebar">
      <div id="history"></div>
    </aside>
    <main>
      <div id="chat">
        <div id="empty-state">
          <p>Start a conversation</p>
        </div>
      </div>
      <div id="attachments"></div>
      <div id="input-bar">
        <button id="attach-btn" title="Attach file">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2l3 6h6l-4.5 4.5L18 20l-6-3.5L6 20l1.5-7.5L3 8h6z"/>
          </svg>
        </button>
        <input type="file" id="file-input" multiple accept="image/*,.txt,.md,.csv,.json,.log,.pdf,.doc,.docx" hidden>
        <textarea id="input" rows="1" placeholder="Message..."></textarea>
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
          </svg>
        </button>
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
