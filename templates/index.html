<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curiodromiai</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">

    <!-- Pull tab: opens the side panel (history + settings) -->
    <button type="button" id="panel-pull-tab" class="pull-tab" aria-label="Open history and settings" title="History &amp; settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </button>

    <!-- Side panel: history + settings -->
    <aside id="side-panel" class="side-panel">
      <div class="side-panel-header">
        <span class="side-panel-title">History &amp; Settings</span>
        <a id="logout-link" class="text-btn logout-link" href="/logout" hidden>Log out</a>
        <button type="button" id="panel-close-btn" class="icon-btn panel-close" aria-label="Close panel">✕</button>
      </div>

      <div class="side-panel-body">
        <section class="panel-section">
          <div class="panel-section-title">Model</div>
          <select id="model-select" class="model-select">
            <option value="{{ default_model }}">{{ default_model }}</option>
          </select>
        </section>

        <section class="panel-section">
          <div class="panel-section-title">Library (RAG)</div>
          <div class="rag-ingest-row">
            <input type="text" id="rag-folder-input" class="rag-folder-input" placeholder="Path to your books folder">
            <button type="button" id="rag-index-btn" class="rag-index-btn">Index</button>
          </div>
          <p id="rag-status" class="rag-status"></p>
          <div id="rag-sources-list" class="rag-sources-list">
            <p class="conversations-empty">No documents indexed yet.</p>
          </div>
        </section>

        <section class="panel-section conversations-section">
          <div class="panel-section-title-row">
            <div class="panel-section-title">Past conversations</div>
            <button type="button" id="clear-conversations-btn" class="text-btn" title="Delete all conversation history">Clear all</button>
          </div>
          <div id="conversations-list" class="conversations-list">
            <p class="conversations-empty">Nothing archived yet.</p>
          </div>
        </section>
      </div>
    </aside>
    <div id="panel-scrim" class="panel-scrim"></div>

    <!-- Main chat column -->
    <div class="app">
      <header class="app-header">
        <div class="header-left">
          <button type="button" id="new-chat-btn" class="icon-btn" aria-label="New chat" title="New chat">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </div>

        <div class="header-center">
          <button type="button" id="tone-btn" class="icon-btn logo-btn" aria-haspopup="true" aria-expanded="false" title="Response tone">
            <svg viewBox="0 0 100 100" class="logo-svg logo-svg-small">
              <path d="M 53.0,50.0 L 53.27,50.52 L 53.45,51.12 L 53.51,51.79 L 53.44,52.5 L 53.23,53.23 L 52.87,53.94 L 52.36,54.62 L 51.7,55.23 L 50.91,55.74 L 50.0,56.12 L 48.99,56.36 L 47.91,56.42 L 46.79,56.29 L 45.67,55.97 L 44.56,55.44 L 43.53,54.7 L 42.59,53.77 L 41.8,52.67 L 41.17,51.4 L 40.75,50.0 L 40.56,48.5 L 40.61,46.95 L 40.92,45.37 L 41.51,43.83 L 42.35,42.35 L 43.46,41.0 L 44.81,39.81 L 46.37,38.83 L 48.11,38.09 L 50.0,37.62 L 51.98,37.47 L 54.02,37.64 L 56.04,38.14 L 58.01,38.98 L 59.86,40.14 L 61.53,41.62 L 62.98,43.39 L 64.15,45.4 L 65.0,47.62 L 65.5,50.0 L 65.62,52.47 L 65.34,54.98 L 64.65,57.46 L 63.55,59.85 L 62.07,62.07 L 60.21,64.06 L 58.03,65.76 L 55.56,67.12 L 52.86,68.09 L 50.0,68.62 L 47.04,68.7 L 44.05,68.31 L 41.12,67.43 L 38.32,66.08 L 35.73,64.27 L 33.42,62.05 L 31.46,59.45 L 29.91,56.53 L 28.83,53.35 L 28.25,50.0 L 28.21,46.55 L 28.72,43.09 L 29.79,39.7 L 31.39,36.48 L 33.52,33.52 L 36.11,30.89 L 39.13,28.67 L 42.51,26.94 L 46.16,25.74 L 50.0,25.13 L 53.94,25.12 L 57.88,25.75 L 61.72,27.0 L 65.36,28.86 L 68.69,31.31 L 71.64,34.28 L 74.11,37.71 L 76.04,41.54 L 77.35,45.67 L 78.0,50.0 L 77.96,54.43 L 77.22,58.85 L 75.78,63.14 L 73.66,67.19 L 70.9,70.9 L 67.56,74.17 L 63.7,76.9 L 59.43,79.01 L 54.82,80.43 L 50.0,81.12 L 45.08,81.05 L 40.19,80.2 L 35.44,78.57 L 30.97,76.19 L 26.89,73.11 L 23.3,69.4 L 20.32,65.12 L 18.02,60.39 L 16.48,55.31 L 15.75,50.0 L 15.86,44.59 L 16.83,39.22 L 18.65,34.03 L 21.28,29.13 L 24.68,24.68 L 28.77,20.77 L 33.46,17.53 L 38.64,15.05 L 44.2,13.39 L 50.0,12.62 L 55.9,12.78 L 61.74,13.86 L 67.39,15.86 L 72.7,18.75 L 77.53,22.47 L 81.75,26.93 L 85.25,32.04 L 87.92,37.68 L 89.69,43.71 L 90.5,50.0 L 90.31,56.38 L 89.11,62.71 L 86.92,68.81 L 83.78,74.54 L 79.74,79.74 L 74.91,84.28 L 69.38,88.03 L 63.29,90.9 L 56.78,92.78 L 50.0,93.62 L 43.13,93.4 L 36.33,92.08"
                    fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="tone-dropdown" class="tone-dropdown hidden" role="menu" aria-label="Response tone">
            <button type="button" class="tone-menu-option" data-tone="empathetic" role="menuitemradio">Empathetic</button>
            <button type="button" class="tone-menu-option" data-tone="factual" role="menuitemradio">Factual</button>
          </div>
        </div>

        <div class="header-right">
          <button type="button" id="exit-btn" class="icon-btn exit-btn" aria-label="Exit app" title="Exit app">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="continuing-banner" class="continuing-banner" hidden>
        <span id="continuing-banner-text"></span>
        <button type="button" id="continuing-banner-dismiss" class="continuing-banner-dismiss" aria-label="Dismiss">✕</button>
      </div>

      <main id="chat" class="chat" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <p>Nothing said yet. Ask a question to begin.</p>
        </div>
      </main>

      <div id="attachments-row" class="attachments-row" hidden></div>

      <form id="chat-form" class="input-bar">
        <input type="file" id="file-input" class="file-input-hidden"
               accept="image/png,image/jpeg,image/gif,image/webp,.txt,.md,.csv,.json,.log,.pdf,.doc,.docx"
               multiple hidden>
        <button type="button" id="file-import-btn" class="icon-btn attach-btn" aria-label="Attach file" title="Attach a document or image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="4" width="16" height="16" rx="3"/>
          </svg>
        </button>
        <textarea
          id="chat-input"
          placeholder="Type a message…"
          rows="1"
        ></textarea>
        <button type="submit" id="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M5 3 L21 12 L5 21 Z"/>
          </svg>
        </button>
      </form>
      <p id="status" class="status" role="status"></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
